- version: 0.1.18
  date: "2026-10-04"
  status: released
  entries:
  - type: feat
    description: Stateful `crowbar session` CLI command system with persistent iteration
      memory, multi-armed bandit reward feedback, and automatic baseline reset
    bullet: ✦
  - type: feat
    description: Dynamic `crowbar session setup` command to configure active rules,
      mutator pools, execution patterns, and targeted selector scopes
    bullet: ✦
  - type: feat
    description: Structure-preserving Doom WAD fuzzer (`WADRule`) preserving 12-byte
      header, 16-byte lump directory table entries, and structured payloads (THINGS,
      VERTEXES, LINEDEFS, sound/graphics)
    bullet: ✦
  - type: feat
    description: Portable Document Format fuzzer (`PDFRule`) preserving indirect object
      framing, mutating dictionary attributes and stream bodies, with automated `startxref`
      offset synchronization
    bullet: ✦
  - type: feat
    description: Structure-preserving media format rules for MP3 (ID3v2 tags & MPEG
      frame sync words), WAV (RIFF container & fmt headers), PNG (chunk framing &
      auto-CRC32), and BMP (DIB headers & pixel rasters)
    bullet: ✦
  - type: feat
    description: Automatic magic-byte and framing format detector (`Crowbar::Detector`)
      for piped streams across 18 protocols, media, and document formats
    bullet: ✦
  - type: feat
    description: RFC 959 FTP CRLF stream fuzzer and structure-preserving SQL AST query
      transformer
    bullet: ✦
  - type: fix
    description: Cross-platform POSIX STDIN data detection using LibC poll for Linux
      and macOS
    bullet: ✓
